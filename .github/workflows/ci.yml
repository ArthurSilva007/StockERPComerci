name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build e testes
        run: mvn --batch-mode --no-transfer-progress clean verify

  dependency-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OWASP Dependency-Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:13.0.0:check
          -DskipTests
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${NVD_API_KEY}

      - name: Avisar que a analise foi ignorada sem NVD_API_KEY
        if: ${{ env.NVD_API_KEY == '' }}
        run: echo "::warning::Configure o secret NVD_API_KEY para executar o OWASP Dependency-Check."
